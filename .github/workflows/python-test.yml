name: Python bindings

# Builds the native library and runs the Python ctypes binding tests
# (bindings/python/tests) against it. The bindings are a thin wrapper over the
# same libwabisabi the C and C# sides use; nothing else in CI catches them
# drifting from the FFI wire format, so they get their own gate (see
# bindings/CLAUDE.md).

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  python:
    name: "Python bindings ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # linux-x64, osx-arm64
    steps:
      - uses: actions/checkout@v4

      - name: "Install cmake"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y cmake
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew list cmake >/dev/null 2>&1 || brew install cmake
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "Build native library"
        # Building the test target also builds the shared libwabisabi the
        # bindings load (auto-discovered from c/build by wabisabi._native).
        run: |
          cmake -B c/build -S c -DCMAKE_BUILD_TYPE=Release
          cmake --build c/build --config Release --target wabisabi_test

      - name: "Install pytest"
        run: python -m pip install --upgrade pip pytest

      - name: "Run Python binding tests"
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/c/build
          PYTHONPATH: ${{ github.workspace }}/bindings/python
        run: python -m pytest bindings/python/tests -q
